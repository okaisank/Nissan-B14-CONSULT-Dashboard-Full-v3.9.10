[platformio]
default_envs = b14v310
workspace_dir = C:/pio/b14v310

[env:b14v310]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = espidf

upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
upload_speed = 921600

; Build conservatively for the standard N8 board definition.
; The project partition table fits inside 8 MB.
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.flash_mode = dio
board_build.partitions = partitions.csv

; Extra belt-and-suspenders flag for the project C++ bridge.
build_flags =
    -fexceptions
